# RSS sources to ingest.
#
# tier1 = trusted journalist / insider outlet (e.g. Fabrizio Romano, CaughtOffside)
# tier2 = general news aggregator (e.g. BBC, Guardian, Marca)
#
# language = ISO 639-1 code for the feed's article language (en, es, de,
# it, fr, ...). Optional, defaults to "en" if omitted. Non-English
# sources skip the English keyword pre-filter (ingestion/relevance_filter.py)
# and go straight to the LLM extraction step instead, since a keyword
# regex can't do relevance filtering in a language it isn't written for.
#
# Fill in / confirm URLs marked TODO before running.

sources:
  - name: caughtoffside
    url: https://caughtoffside.com/feed
    tier: tier1
    language: en

  - name: fabrizio_romano_daily_briefing
    url: https://thedailybriefing.io/feed
    tier: tier1
    language: en

  - name: rmcMercato
    url: https://rmcsport.bfmtv.com/rss/football/transferts/
    tier: tier1
    language: fr

  - name: transfermarketUk
    url: https://www.transfermarkt.co.uk/rss/news
    tier: tier1
    language: en

  - name: transfermarketIt
    url: https://www.transfermarkt.it/rss/news
    tier: tier1
    language: it

  - name: transfermarketDe
    url: https://www.transfermarkt.de/rss/news
